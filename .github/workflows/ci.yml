name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # package.json の engines (^20.19.0 || >=22.12.0) の下限と最新 LTS で確認する
        node: ['20.19', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # fix-paths.js による参照ファイルの存在確認も含む
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # 本番に含まれる依存関係の高リスク以上の脆弱性があれば失敗させる
      - run: npm audit --omit=dev --audit-level=high
